- id: atlas_solar_1
  titolo: "Agrivoltaico Atlas Solar 1 – Bicinicco e Santa Maria la Longa"
  comuni: [Bicinicco, Santa Maria la Longa, Palmanova]
  tipo: Agrivoltaico
  potenza_mw: 13.336
  procedura: "Autorizzazione unica (L.R. 19/2012) + VIA statale"
  stato: "Autorizzato (AU n. 43585/GRFVG del 13/09/2024); verifica di ottemperanza in corso (2025)"
  compensazione_eur: 180000
  compensazione_descrizione: >
    Una tantum, ripartita 37,16% Bicinicco e 62,84% Santa Maria la Longa; i Comuni realizzano gli
    interventi e li rendicontano alla società. In più 10 kW di pannelli per Comune.
    Convenzione da firmare prima dell'inizio lavori.
  promesso: "Fino al 3% del VAN dei proventi, misure per tutta la vita dell'impianto (dichiarazione di impegno, 22/12/2022)"
  lezioni:
    - "Il Comune di Santa Maria la Longa ha dato parere negativo (saturazione del limite del PRGC): superato in conferenza di servizi «a posizioni prevalenti», con variante urbanistica imposta dall'AU."
    - "Da un impegno «fino al 3%» si è arrivati a 180.000 € una tantum, circa lo 0,3% dei proventi stimati su 30 anni."
    - "Il Comune ha dichiarato per iscritto di non poter esaminare la documentazione in 13 giorni lavorativi con un solo tecnico in ufficio."
  fonti:
    - "Decreto AU n. 43585/GRFVG del 13/09/2024, art. 9 e 16"
    - "Dichiarazione di impegno e bozza di convenzione Atlas Solar 1, 22/12/2022"
    - "Parere Comune di Santa Maria la Longa, 04/08/2022; nota del Sindaco 15/07/2025 (MASE-2025-0138348)"

