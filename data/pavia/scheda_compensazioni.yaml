# Scheda compensazioni del Comune di Pavia di Udine.
# Fonte: schede FER e decreti forniti dal Comune (elenco FER al 20/10/2026), letti il 30/10/2026.
# Importi come risultano dalle schede comunali e dai decreti; "eur_mw" = importo una tantum diviso per la potenza.
aggiornato_al: 2026-11-06
titolo: "Pavia di Udine – compensazioni: stato e progetti da seguire"
sintesi: >
  Pavia di Udine ha ottenuto quasi solo compensazioni una tantum (circa 3,4 milioni di euro noti, in opere o denaro),
  mentre Santa Maria la Longa, sugli stessi impianti, ha ottenuto quote annuali sui ricavi per tutta la vita degli impianti.

novita:
  - titolo: "Il caso Crimea è il modello da seguire"
    testo: >
      Senza accordo firmato, la Regione ha fissato in conferenza il 3% annuo dei proventi, incentivi compresi, per tutta
      la vita dell'impianto: l'impresa accantona la quota, il Comune realizza le opere e viene rimborsato a rendiconto
      (decreto 17640/GRFVG del 02/04/2026, art. 9).
  - titolo: "Sugli accumuli Pavia ha accettato importi fissi"
    testo: >
      1,4 milioni monetizzati per Enel (200 MW), 1 milione in opere per RNE14 (90 MW), opere senza importo per Aukera
      (137,75 MW): tra 7.000 e 11.000 euro per MW, una volta sola.
  - titolo: "Santa Maria la Longa ha ottenuto quote annue sugli stessi impianti"
    testo: "1,5% dei proventi da Santo Stefano; 2,1% da Aukera dal sesto anno, più anticipo e quota fissa per cinque anni."
  - titolo: "Le competenze sono chiarite"
    testo: >
      I BESS n. 16 e n. 20 sono autorizzati dalla Regione (decreti 37803 e 40713/GRFVG), il n. 1 dal Ministero
      (decreto 55/17/2022, ora Enel Libra Flexsys). Contessa è l'agrivoltaico EG Equinozio da 29,976 MWp.
  - titolo: "Due PAS respinte torneranno in autorizzazione unica"
    testo: >
      KI Italia a Risano e a Lauzacco, respinte a settembre 2026 per la fascia di rispetto cimiteriale: in
      autorizzazione unica varrà almeno il 3%.
  - titolo: "Il biometano di via Tombis è una riconversione incentivata dal PNRR"
    testo: >
      GIOVE Energy Soc. Agr. ha convertito il biogas da 999 kWe del 2012 in un impianto da 500 Smc/h (4,2 milioni di Smc
      l'anno), con PAS comunale e incentivo GSE (bando 5 del DM 15/9/2022, posizione 123). Dieta dichiarata: 30.500 t di
      colture energetiche, 18.000 t di effluenti, 9.200 t di sottoprodotti. Nessuna compensazione nelle schede del Comune;
      all'inaugurazione l'assessore Palandrani ha annunciato un confronto con CH4T sulle opere di compensazione. Il 3% dei
      proventi varrebbe circa 140.000 euro l'anno.
  - titolo: "Ci sono clausole sfavorevoli al Comune"
    testo: >
      Nel caso RNE14 le autorizzazioni delle opere compensative sono a carico del Comune, i lavori non possono partire
      prima del cantiere del BESS e mancano fideiussione e rivalutazione.

