confronto:
  testo: >
    Sugli stessi impianti il Comune vicino ha ottenuto entrate annuali che durano decenni; Pavia ha chiuso con opere una
    tantum. In parte la differenza si spiega con l'occupazione di suolo (per Aukera il 70% è a Santa Maria la Longa), ma
    il metodo conta più della quota: una percentuale annua cresce con i ricavi e dura quanto l'impianto.
  righe:
    - {impianto: "Santo Stefano, fotovoltaico 50 MW", pavia: "Auto elettrica e arredo parco",
       smll: "1,5% dei proventi annui, incentivi compresi, per tutta la vita dell'impianto"}
    - {impianto: "BESS Aukera, 137,75 MW", pavia: "Opere stimabili in qualche centinaio di migliaia di euro",
       smll: "300.000 € di anticipo, 40.000 €/anno per 5 anni, poi 2,1% dei proventi fino alla dismissione"}
    - {impianto: "Cjase Sterpet, fotovoltaico 105 MW", pavia: "850.000 € in opere",
       smll: "Opere da convenzione (DCC 24/2023), importo da verificare"}

