clausole:
  - "Quota annua in percentuale dei proventi per tutta la vita dell'impianto, con anticipo alla firma o all'avvio dei lavori"
  - "Minimo garantito annuo e rivalutazione ISTAT"
  - "Rendiconto annuale dei ricavi da parte dell'impresa"
  - "Fideiussione a prima richiesta prima dell'inizio dei lavori"
  - "Progettazione e autorizzazioni delle opere a carico dell'impresa, non del Comune"
  - "Scadenze certe e penali, non legate all'avvio del cantiere dell'impresa"
  - "Obblighi trasferiti a chi subentra nel titolo o nell'impianto"
  - "Solo misure ammesse dal DM 10/9/2010, All. 2: niente sponsorizzazioni o somme senza vincolo di destinazione"
  - "Ripartizione concordata con i Comuni vicini quando l'impianto o le opere li toccano"

