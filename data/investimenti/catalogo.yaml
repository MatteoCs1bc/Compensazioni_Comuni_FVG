    leve: ["Collaborazione con ARPA FVG e università"]
    esempio: "ARPA FVG ha un protocollo per il monitoraggio del suolo negli impianti agro e fotovoltaici."
  - id: scuole
    nome: "Educazione e sportello energia per i cittadini"
    categoria: sensibilizzazione
    unita: anni
    costo_unitario: 8000
    intervallo: [4000, 15000]
    quantita_default: 3
