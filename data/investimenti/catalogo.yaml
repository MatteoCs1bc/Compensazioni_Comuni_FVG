    leve: []
    esempio: ""

non_ammessi:
  - "Versamenti in denaro nelle casse comunali senza un intervento collegato"
  - "Energia gratuita o sconti in bolletta diretti alle famiglie (lo ha chiarito anche il caso di Udine San Gottardo)"
  - "Spese correnti generiche del bilancio comunale"
