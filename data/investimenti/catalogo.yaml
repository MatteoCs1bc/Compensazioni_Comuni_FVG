# Catalogo degli interventi finanziabili con le compensazioni (DM 10/9/2010, Allegato 2).
# Costi INDICATIVI 2025-26, IVA esclusa, da sostituire con preventivi o computi del Comune.
# categoria: ambiente | efficienza | rinnovabili | sensibilizzazione
aggiornato_al: 2026-10-14
nota_costi: "Costi indicativi di mercato, da verificare con preventivi o computi metrici. Gli incentivi citati vanno verificati sul bando in vigore."

interventi:
  - id: fv_edifici
    nome: "Fotovoltaico su scuole, palestre e municipio"
    categoria: rinnovabili
    unita: kWp
    costo_unitario: 1400
    intervallo: [1200, 1800]
    quantita_default: 50
    beneficio: "Circa 1.250 kWh per kWp all'anno; con l'autoconsumo riduce la bolletta del Comune."
    leve: ["Incentivo GSE sull'energia condivisa se l'impianto entra in una CER", "Bandi regionali FVG per l'energia negli edifici pubblici"]
    esempio: "Atlas Solar 1: 10 kW di pannelli per Comune; Cjase Sterpet (Pavia di Udine): impianto da 400 kWp come compensazione."
  - id: accumulo_edificio
    nome: "Batteria per un edificio comunale"
    categoria: rinnovabili
    unita: kWh
    costo_unitario: 650
    intervallo: [450, 850]
    quantita_default: 50
    beneficio: "Sposta sulla sera l'energia prodotta di giorno; utile per palestre e centri civici."
    leve: []
    esempio: ""
  - id: cer
    nome: "Avvio di una Comunità energetica rinnovabile comunale"
    categoria: rinnovabili
    unita: forfait
    costo_unitario: 25000
    intervallo: [10000, 40000]
    quantita_default: 1
    beneficio: "Statuto, studio di fattibilità, piattaforma di gestione. È la strada legittima per portare benefici economici alle famiglie, incluse quelle in povertà energetica."
    leve: ["Incentivo GSE sull'energia condivisa per 20 anni", "Contributi per CER nei piccoli Comuni (verificare apertura e scadenze)"]
    esempio: "Attenzione: 97 Comuni FVG su 215 sono divisi tra più cabine primarie (vedi Quadro FVG)."
  - id: led
    nome: "Illuminazione pubblica a LED"
    categoria: efficienza
    unita: punti luce
    costo_unitario: 600
    intervallo: [400, 900]
    quantita_default: 100
    beneficio: "Riduce del 50–70% i consumi dell'illuminazione pubblica."
    leve: ["Contratti a prestazione garantita (ESCo)"]
    esempio: ""
  - id: pdc
    nome: "Pompa di calore in un edificio comunale"
    categoria: efficienza
    unita: kW termici
    costo_unitario: 1100
    intervallo: [800, 1500]
    quantita_default: 60
    beneficio: "Sostituisce la caldaia a gas; con il fotovoltaico sul tetto riduce costi ed emissioni."
    leve: ["Conto Termico (GSE) per le pubbliche amministrazioni"]
    esempio: ""
  - id: isolamento
    nome: "Isolamento termico di un edificio pubblico"
    categoria: efficienza
    unita: m²
    costo_unitario: 160
    intervallo: [120, 220]
    quantita_default: 500
    beneficio: "Riduce il fabbisogno di riscaldamento del 20–40%."
    leve: ["Conto Termico (GSE) per le pubbliche amministrazioni"]
    esempio: ""
  - id: ricarica
    nome: "Colonnine di ricarica pubbliche (22 kW)"
    categoria: efficienza
    unita: colonnine
    costo_unitario: 12000
    intervallo: [8000, 18000]
    quantita_default: 2
