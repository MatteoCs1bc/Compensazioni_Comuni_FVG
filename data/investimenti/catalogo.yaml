    esempio: "La forestazione è la prima opera tipica nella stima APE FVG."
  - id: siepi
    nome: "Siepi, filari e corridoi ecologici"
    categoria: ambiente
    unita: metri
    costo_unitario: 25
    intervallo: [15, 40]
    quantita_default: 2000
